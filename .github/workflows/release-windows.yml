# Builds the Windows installer and publishes it as a GitHub Release whenever the app changes on main.
# Installed copies of the app find the new release by themselves, download it and offer to restart.
# Your data is stored outside the program folder (in %APPDATA%\Cursus CoS), so an update never touches it.
name: Release Windows app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'tailwind.config.js'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: skips the Android icon tool and other things this build does not need
      - run: npm install --ignore-scripts --no-audit --no-fund
      # Each run gets the next version number (1.0.1, 1.0.2, ...). Installed apps update when the number is higher than theirs.
      - name: Set version
        shell: bash
        run: npm pkg set version=1.0.${{ github.run_number }}
      # GitHub only accepts a release for a tag that already exists, so create the tag for this version first
      - name: Tag this version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.0.${{ github.run_number }}
          git push origin v1.0.${{ github.run_number }}
      - run: node scripts/build.mjs
      - name: Build installer and publish release
        shell: bash
        run: |
          set +e
          npx electron-builder --win nsis --publish always > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            # also put the end of the log in a visible message, so a failure can be read without opening the full log
            msg=$(grep -v '^  "' build.log | grep -v '^    at ' | tail -n 40 | tr '\r' ' ' | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=electron-builder failed (exit $code)::$msg"
            exit $code
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
