# Builds the Android app (an APK you install on your phone) and keeps ONE download link up to date:
#   https://github.com/sozumen/Cursus-CoS/releases/download/android/Cursus-CoS.apk
# The APK is signed with the key stored in the repository secrets, so every new build installs over the old one and keeps its data.
# This release is marked "pre-release" on purpose, so it never becomes the "latest" release that the Windows app checks for updates.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'tailwind.config.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/build.mjs
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Prepare the signing key
        shell: bash
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cursus.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/cursus.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning title=No signing key::The ANDROID_KEYSTORE_BASE64 secret is not set, so this APK is signed with a temporary debug key and cannot be updated in place later."
          fi
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Build the APK
        shell: bash
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }} > ../gradle.log 2>&1
          code=$?
          tail -n 60 ../gradle.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error|Error|FAILED|What went wrong|Could not|not found|>" ../gradle.log | tail -n 25 | tr '\r' ' ' | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed (exit $code)::$msg"
            exit $code
          fi
      - name: Publish the APK at a fixed link
        shell: bash
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" Cursus-CoS.apk
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --latest=false --title "Cursus CoS for Android" --notes "placeholder"
          gh release upload android Cursus-CoS.apk --clobber
          gh release edit android --prerelease --latest=false --notes "Android build: ${{ github.run_number }}
          Version: 1.0.${{ github.run_number }}
          Download on your phone: https://github.com/${{ github.repository }}/releases/download/android/Cursus-CoS.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
